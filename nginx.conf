server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # Three 12 MiB files plus bounded multipart framing. Fastify enforces the
    # precise 37,814,272-byte aggregate limit and returns the stable API error.
    client_max_body_size 37m;

    error_page 413 = @progress_photo_payload_too_large;
    location @progress_photo_payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"BODY_PROGRESS_PHOTO_SIZE_LIMIT","message":"Request exceeds the progress photo upload limit"}}';
    }

    # Defense in depth: private media is never copied into or served by nginx.
    location ^~ /private/ {
        return 404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:3001;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
